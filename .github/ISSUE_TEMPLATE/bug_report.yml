name: Bug report
description: Report reproducible library or backend behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or sensitive logs. Report vulnerabilities through the private link shown before opening an issue.
  - type: input
    id: version
    attributes:
      label: Library version
      description: Tag, pseudo-version, or commit hash.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.27.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/version, architecture, and whether this is desktop, headless/SSH, container, system service, WSL2, or native Windows/macOS.
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend diagnostics
      description: Include non-sensitive Info fields, ordered rejection categories, and errors.Is/errors.As results. Redact private service and key names.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe program and exact steps that reproduce the problem using generated test values.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed secret values, tokens, private keys, private service/account names, and sensitive logs.
          required: true
        - label: I checked whether this environment is listed as currently unvalidated in docs/support.md.
          required: true
